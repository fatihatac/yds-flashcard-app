name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/turkish-conjunction-flashcards-06xcjk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js data icons _site/
          SHA="${GITHUB_SHA::7}"
          echo "export const VERSION = '$SHA';" > _site/js/version.js
          sed -i "s/const VERSION = 'dev'/const VERSION = '$SHA'/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
